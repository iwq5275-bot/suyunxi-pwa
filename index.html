<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>苏云汐</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="苏云汐">
<meta name="theme-color" content="#f7f3ee">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overscroll-behavior:none; }
  body {
    font-family:-apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:#f7f3ee; color:#1a1a1a; font-size:16px;
    display:flex; flex-direction:column; height:100dvh;
  }
  /* 顶栏 */
  header {
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
    background:rgba(247,243,238,.92); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    border-bottom:1px solid #e8e0d6;
    display:flex; align-items:center; gap:12px; flex-shrink:0; z-index:10;
  }
  .avatar { width:44px; height:44px; border-radius:50%; object-fit:cover; background:#e8d9c8; flex-shrink:0; }
  .who { flex:1; min-width:0; }
  .who .name { font-weight:700; font-size:17px; }
  .who .status { font-size:12px; color:#a08c78; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .dot { width:8px; height:8px; border-radius:50%; background:#7ed491; display:inline-block; margin-right:4px; }
  /* 消息区 */
  #msgs { flex:1; overflow-y:auto; padding:14px 14px 8px; -webkit-overflow-scrolling:touch; }
  .day { text-align:center; font-size:12px; color:#b3a48f; margin:10px 0; }
  .row { display:flex; margin:7px 0; align-items:flex-end; }
  .row.me { justify-content:flex-end; }
  .bubble {
    max-width:76%; padding:10px 13px; border-radius:18px; line-height:1.55;
    font-size:16px; word-break:break-word; position:relative;
    animation:pop .18s ease-out;
  }
  @keyframes pop { from { transform:scale(.96); opacity:.4; } }
  .row.her .bubble { background:#fff; border-bottom-left-radius:6px; box-shadow:0 1px 2px rgba(0,0,0,.06); margin-left:8px; }
  .row.me .bubble { background:#95ec69; border-bottom-right-radius:6px; margin-right:0; }
  .mini-avatar { width:32px; height:32px; border-radius:50%; object-fit:cover; flex-shrink:0; background:#e8d9c8; }
  .ts { font-size:10px; color:#c4b6a3; text-align:center; margin:2px 0 6px; }
  /* 语音按钮 */
  .speak {
    display:inline-flex; align-items:center; gap:4px; margin-top:6px;
    font-size:12px; color:#b08d6a; background:#faf6f1; border:1px solid #efe6d9;
    border-radius:20px; padding:4px 10px; cursor:pointer; user-select:none;
  }
  .speak:active { background:#f1e9dd; }
  .speak .bar { display:none; width:60px; height:3px; background:#e5d8c5; border-radius:2px; overflow:hidden; }
  .speak.playing .bar { display:inline-block; }
  .speak.playing .bar i { display:block; height:100%; width:30%; background:#c99a63; border-radius:2px; animation:slide 1s infinite linear; }
  @keyframes slide { from { margin-left:-30%; } to { margin-left:100%; } }
  /* 正在输入 */
  #typing { display:none; padding:2px 14px 6px; font-size:12px; color:#b3a48f; }
  #typing .tdots span { animation:blink 1.2s infinite; }
  #typing .tdots span:nth-child(2){ animation-delay:.2s } #typing .tdots span:nth-child(3){ animation-delay:.4s }
  @keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }
  /* 输入栏 */
  #inputbar {
    display:flex; gap:8px; align-items:flex-end; flex-shrink:0;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:rgba(247,243,238,.95); border-top:1px solid #e8e0d6;
  }
  #text {
    flex:1; border:1px solid #e3d9cb; border-radius:20px; padding:10px 14px;
    font-size:16px; background:#fff; outline:none; resize:none; max-height:110px; line-height:1.4;
  }
  #send {
    width:44px; height:44px; border-radius:50%; border:none; flex-shrink:0;
    background:#e8b04b; color:#fff; font-size:16px; cursor:pointer;
  }
  #send:active { transform:scale(.93); }
  #send:disabled { background:#d8cdbf; }
  /* key 输入 */
  #gate { position:fixed; inset:0; background:#f7f3ee; z-index:99; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:30px; }
  #gate.show { display:flex; }
  #gate input { font-size:18px; padding:12px 16px; border-radius:12px; border:1px solid #ddd; width:100%; max-width:300px; text-align:center; letter-spacing:2px; }
  #gate button { padding:12px 40px; border-radius:24px; border:none; background:#e8b04b; color:#fff; font-size:16px; }
  /* 图片气泡 */
  .bubble.img-bubble { padding:4px; background:#fff; }
  .bubble.img-bubble img { display:block; max-width:220px; max-height:280px;
    border-radius:14px; object-fit:cover; }
  /* 语音条 */
  .voice { display:flex; align-items:center; gap:8px; min-width:120px; cursor:pointer;
    user-select:none; -webkit-user-select:none; }
  .voice .vplay { width:28px; height:28px; border-radius:50%; background:#e8b04b;
    color:#fff; display:flex; align-items:center; justify-content:center;
    font-size:12px; flex-shrink:0; }
  .voice .vwave { display:flex; align-items:flex-end; gap:2px; height:20px; flex:1; }
  .voice .vwave i { width:3px; background:#d8a94e; border-radius:2px; }
  .voice.playing .vwave i { animation:wv .8s infinite ease-in-out; }
  .voice.playing .vwave i:nth-child(2){animation-delay:.15s}
  .voice.playing .vwave i:nth-child(3){animation-delay:.3s}
  .voice.playing .vwave i:nth-child(4){animation-delay:.45s}
  .voice.playing .vwave i:nth-child(5){animation-delay:.6s}
  @keyframes wv { 0%,100%{height:6px} 50%{height:18px} }
  .voice .vdur { font-size:12px; color:#a08c78; flex-shrink:0; }
  /* 全屏看图 */
  #imgview { position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:200;
    display:none; align-items:center; justify-content:center; }
  #imgview.show { display:flex; }
  #imgview img { max-width:100%; max-height:100%; object-fit:contain; }
  #conn { position:fixed; top:calc(64px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.65); color:#fff; font-size:12px; padding:6px 14px; border-radius:16px;
    display:none; z-index:50; }
  /* 调试面板：三击顶栏头像开启 */
  #debugpanel { position:fixed; bottom:calc(70px + env(safe-area-inset-bottom)); left:10px; right:10px;
    z-index:60; display:none; }
  #debugpanel.show { display:block; }
  #diag { max-height:120px; overflow-y:auto; background:rgba(0,0,0,.78); color:#0f0; font-size:10px;
    font-family:monospace; padding:8px; border-radius:8px; white-space:pre-wrap; margin-bottom:8px; }
  #wipe { background:#c0392b; color:#fff; border:0; border-radius:8px; padding:10px 16px;
    font-size:13px; width:100%; }
  #dbgver { text-align:center; color:#888; font-size:10px; margin-bottom:6px; font-family:monospace; }
</style>
</head>
<body>
<header>
  <img class="avatar" id="avatar" src="avatar.png" alt="汐" onerror="this.style.display='none'">
  <div class="who">
    <div class="name">苏云汐</div>
    <div class="status"><span class="dot"></span><span id="status">连接中…</span></div>
  </div>
</header>
<div id="conn">连接断开，重连中…</div>
<div id="debugpanel"><div id="dbgver">v8</div><div id="diag"></div><button id="wipe">清缓存并重载</button></div>
<div id="msgs"></div><div id="imgview" onclick="this.classList.remove('show')"><img id="imgviewimg"></div>
<div id="typing"><span class="tdots">她正在输入<span>.</span><span>.</span><span>.</span></span></div>
<div id="inputbar">
  <textarea id="text" rows="1" placeholder="跟她说点什么…"></textarea>
  <button id="send" disabled>➤</button>
</div>
<div id="gate">
  <div style="font-size:20px;font-weight:700">苏云汐的聊天室</div>
  <div style="color:#a08c78;font-size:14px">输入访问口令</div>
  <input id="keyinput" type="password" placeholder="口令" autocomplete="off">
  <button id="keygo">进入</button>
</div>

<script src="mqtt.min.js"></script>
<script>
(function(){
  "use strict";
  const $ = id => document.getElementById(id);
  const msgs = $("msgs"), text = $("text"), sendBtn = $("send"), typing = $("typing");
  let KEY = new URLSearchParams(location.search).get("key") || localStorage.getItem("suyunxi_key") || "";
  let mqttClient = null, AESKEY = null;

  if (new URLSearchParams(location.search).get("key")) {
    localStorage.setItem("suyunxi_key", KEY);
    history.replaceState(null, "", location.pathname);
  }
  if (!KEY) { $("gate").classList.add("show"); }
  $("keygo").onclick = () => {
    const v = $("keyinput").value.trim();
    if (!v) return;
    KEY = v; localStorage.setItem("suyunxi_key", KEY);
    $("gate").classList.remove("show"); boot();
  };

  /* ---- 端到端加密：AES-256-GCM，key = SHA256(pwa_key) ---- */
  async function deriveKey() {
    const raw = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(KEY));
    AESKEY = await crypto.subtle.importKey("raw", raw, {name:"AES-GCM"}, false, ["encrypt","decrypt"]);
    return Array.from(new Uint8Array(raw.slice(0,8)))
      .map(b=>b.toString(16).padStart(2,"0")).join("");
  }
  async function enc(obj) {
    const nonce = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv:nonce}, AESKEY,
      new TextEncoder().encode(JSON.stringify(obj)));
    const buf = new Uint8Array(12 + ct.byteLength);
    buf.set(nonce); buf.set(new Uint8Array(ct), 12);
    let s = "";
    for (let i=0;i<buf.length;i++) s += String.fromCharCode(buf[i]);
    return btoa(s);
  }
  async function dec(s) {
    const bin = Uint8Array.from(atob(s), c=>c.charCodeAt(0));
    const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:bin.slice(0,12)}, AESKEY, bin.slice(12));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const dayStr = ts => new Date(ts).toLocaleDateString("zh-CN",{month:"long",day:"numeric"});
  let lastDay = "";

  function addItem(role, item, ts) {
    const day = dayStr(ts);
    if (day !== lastDay) { lastDay = day;
      msgs.insertAdjacentHTML("beforeend", `<div class="day">${day}</div>`);
    }
    const row = document.createElement("div");
    row.className = "row " + (role === "kio" ? "me" : "her");
    if (role === "kio") {
      row.innerHTML = `<div class="bubble">${esc(item.text || "")}</div>`;
    } else if (item.kind === "image") {
      const src = item.url || ("data:" + (item.mime || "image/jpeg") + ";base64," + item.data);
      row.innerHTML = `<img class="mini-avatar" src="avatar.png" onerror="this.style.display='none'">` +
        `<div class="bubble img-bubble"><img src="${src}" loading="lazy"></div>`;
      row.querySelector("img[src^='data'], img[src^='http']").onclick = e => {
        $("imgviewimg").src = e.target.src;
        $("imgview").classList.add("show");
      };
    } else if (item.kind === "voice") {
      const dur = item.duration || 5;
      const bars = [8,14,10,16,9].map(h=>`<i style="height:${h}px"></i>`).join("");
      row.innerHTML = `<img class="mini-avatar" src="avatar.png" onerror="this.style.display='none'">` +
        `<div><div class="bubble"><div class="voice" data-audio="${item.audio||""}">` +
        `<div class="vplay">▶</div><div class="vwave">${bars}</div>` +
        `<div class="vdur">${dur}"</div></div></div></div>`;
      row.querySelector(".voice").onclick = e => playVoice(e.currentTarget);
    } else {
      const t = esc(item.text || "");
      row.innerHTML = `<img class="mini-avatar" src="avatar.png" onerror="this.style.display='none'">` +
        `<div><div class="bubble">${t}</div>` +
        `<div class="speak" data-text="${esc(item.text||"")}">\uD83D\uDD0A 听她说</div></div>`;
      row.querySelector(".speak").onclick = e => speak(e.currentTarget);
    }
    msgs.appendChild(row);
    scrollBottom();
  }
  function addMsg(role, bubble, ts) {
    addItem(role, {kind:"text", text:bubble}, ts);
  }
  function scrollBottom(){ msgs.scrollTop = msgs.scrollHeight; }

  /* ---- 语音：先用 iOS 系统中文语音，定制音色下个版本接 ---- */

  function resetSpeakBtns() {
    document.querySelectorAll(".speak.playing").forEach(b => {
      b.classList.remove("playing"); b.innerHTML = "\uD83D\uDD0A 听她说";
    });
  }
  if (window.speechSynthesis) speechSynthesis.getVoices();
  /* ---- 真人语音：播 base64 MP3 ---- */
  let curAudio = null, curVoiceEl = null;
  function playVoice(el) {
    const b64 = el.getAttribute("data-audio");
    if (!b64) return;
    if (curAudio && !curAudio.paused && curVoiceEl === el) {
      curAudio.pause(); el.classList.remove("playing");
      el.querySelector(".vplay").textContent = "▶";
      return;
    }
    stopVoice();
    try {
      const bin = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
      const blob = new Blob([bin], {type:"audio/mpeg"});
      curAudio = new Audio(URL.createObjectURL(blob));
      curVoiceEl = el;
      el.classList.add("playing");
      el.querySelector(".vplay").textContent = "⏸";
      curAudio.onended = () => stopVoice();
      curAudio.onerror = () => stopVoice();
      curAudio.play().catch(()=>stopVoice());
    } catch(e) { stopVoice(); }
  }
  function stopVoice() {
    if (curAudio) { try{curAudio.pause();}catch(e){} curAudio = null; }
    if (curVoiceEl) {
      curVoiceEl.classList.remove("playing");
      const p = curVoiceEl.querySelector(".vplay");
      if (p) p.textContent = "▶";
      curVoiceEl = null;
    }
  }
  /* ---- 听她说：请求真人 TTS ---- */
  const ttsCache = {};
  async function speak(btn) {
    const t = btn.getAttribute("data-text");
    if (!t || !mqttClient || !mqttClient.connected) return;
    if (btn.classList.contains("playing")) { stopVoice(); resetSpeakBtns(); return; }
    resetSpeakBtns(); stopVoice();
    btn.classList.add("playing");
    btn.innerHTML = "\uD83D\uDD0A 生成中…";
    const playB64 = (b64, dur) => {
      btn.innerHTML = "\uD83D\uDD0A 听她说";
      // 伪装成 voice item 复用播放器
      const tmp = document.createElement("div");
      tmp.className = "voice"; tmp.setAttribute("data-audio", b64);
      tmp.style.display = "none";
      document.body.appendChild(tmp);
      playVoice(tmp);
      const iv = setInterval(() => {
        if (!curAudio || curAudio.paused) { clearInterval(iv); tmp.remove(); resetSpeakBtns(); }
      }, 500);
    };
    if (ttsCache[t]) { playB64(ttsCache[t].audio, ttsCache[t].duration); return; }
    const reqId = "tts" + Date.now();
    ttsPending[reqId] = (b64, dur) => {
      ttsCache[t] = {audio:b64, duration:dur};
      playB64(b64, dur);
    };
    sendObj({type:"tts_req", text:t, id:reqId});
    // 30 秒没回来就恢复按钮
    setTimeout(() => {
      if (ttsPending[reqId]) { delete ttsPending[reqId]; resetSpeakBtns(); }
    }, 30000);
  }
  const ttsPending = {};

  /* ---- MQTT 传输（公共中继，两端都是出站，无需隧道） ---- */
  let TOPIC_UP = "", TOPIC_DOWN = "";
  const pendingQ = [];
  let DEBUG = false;
  function dlog(s) {
    console.log("[suyunxi] " + s);
    if (!DEBUG) return;
    const el = document.getElementById("diag");
    el.textContent += new Date().toLocaleTimeString() + " " + s + "\n";
    el.scrollTop = el.scrollHeight;
  }
  /* 三击头像开关调试面板 */
  (function(){
    let taps = 0, timer = null;
    $("avatar").addEventListener("click", () => {
      taps++;
      clearTimeout(timer);
      timer = setTimeout(() => { taps = 0; }, 600);
      if (taps >= 3) {
        taps = 0;
        DEBUG = !DEBUG;
        $("debugpanel").classList.toggle("show", DEBUG);
        if (DEBUG) dlog("v7 debug on");
      }
    });
  })();
  function setStatus(t, online) {
    $("status").textContent = t;
    const dot = document.querySelector(".dot");
    if (dot) dot.style.background = online ? "#7ed491" : "#e8b04b";
    sendBtn.disabled = !online;
    if (online) $("conn").style.display = "none";
  }
  async function boot() {
    dlog("v8 boot, mqtt=" + (typeof mqtt) + " keylen=" + KEY.length);
    if (!KEY || typeof mqtt === "undefined") {
      $("conn").style.display = "block";
      $("conn").textContent = "mqtt 库加载失败，检查网络后刷新";
      return;
    }
    const tid = await deriveKey();
    dlog("tid=" + tid);
    TOPIC_UP = `suyunxi/${tid}/up`;
    TOPIC_DOWN = `suyunxi/${tid}/down`;
    connect();
  }
  const BROKERS = ["wss://broker.emqx.io:8084/mqtt"];
  function connect() {
    try { if (mqttClient) mqttClient.end(true); } catch(e){}
    const url = BROKERS[0];
    $("conn").style.display = "block";
    const short = url.replace("wss://","").split("/")[0];
    $("conn").textContent = "连接中(" + short + ")…";
    try { $("status").textContent = "连接中(" + short + ")…"; } catch(e){}
    dlog("try " + short);
    mqttClient = mqtt.connect(url, {
      clientId: "suyunxi-phone-" + Math.random().toString(36).slice(2,10),
      reconnectPeriod: 3000,
      connectTimeout: 10000,
      keepalive: 30,
      clean: true,
      resubscribe: true,
    });
    mqttClient.on("connect", async () => {
      dlog("CONNECTED " + short);
      setStatus("在线", true);
      mqttClient.subscribe(TOPIC_DOWN, {qos: 1}, (err) => {
        dlog(err ? "sub ERR" : "sub OK");
        if (err) setStatus("订阅失败", false);
      });
      await flushQ();
      sendObj({type:"hello_req"});
    });
    mqttClient.on("reconnect", () => {
      dlog("RECONNECT");
      setStatus("重连中…", false);
    });
    mqttClient.on("error", (e) => {
      dlog("ERR " + (e && e.message ? e.message : "unknown"));
    });
    mqttClient.on("offline", () => {
      dlog("OFFLINE");
      setStatus("重连中…", false);
    });
    mqttClient.on("close", () => {
      dlog("CLOSE");
      setStatus("重连中…", false);
    });
    mqttClient.on("message", async (topic, payload) => {
      dlog("msg on " + topic + " len=" + payload.length);
      if (topic !== TOPIC_DOWN) return;
      let d;
      try { d = await dec(payload.toString()); dlog("dec OK type=" + d.type); }
      catch(e){ dlog("dec FAIL " + e.message); return; }
      onMsg(d);
    });
  }
  async function sendObj(o) {
    if (!mqttClient || !mqttClient.connected) {
      dlog("queue " + o.type + " (offline)");
      pendingQ.push(o);
      return;
    }
    try {
      const p = await enc(o);
      mqttClient.publish(TOPIC_UP, p, {qos: 1}, (err) => {
        if (err) { dlog("pub ERR " + o.type + ", requeue"); pendingQ.push(o); }
      });
    } catch(e) { dlog("enc ERR " + e.message); pendingQ.push(o); }
  }
  async function flushQ() {
    while (pendingQ.length && mqttClient && mqttClient.connected) {
      const o = pendingQ.shift();
      dlog("flush " + o.type);
      await sendObj(o);
    }
  }
  function onMsg(d) {
    if (d.type === "hello") {
      $("status").textContent = d.status || "在线";
      msgs.innerHTML = ""; lastDay = "";
      (d.history || []).forEach(h => (h.bubbles||[]).forEach(b => addMsg(h.role, b, h.ts)));
      scrollBottom();
    } else if (d.type === "reply" || d.type === "proactive") {
      typing.style.display = "none";
      const ts = d.ts || new Date().toISOString();
      const items = d.items || (d.bubbles||[]).map(b => ({kind:"text", text:b}));
      items.forEach(it => addItem("yunxi", it, ts));
    } else if (d.type === "tts") {
      const cb = ttsPending[d.id];
      if (cb) { delete ttsPending[d.id]; cb(d.audio, d.duration); }
    } else if (d.type === "typing") {
      typing.style.display = "block"; scrollBottom();
    } else if (d.type === "pong") {
      if (d.status) $("status").textContent = d.status;
    }
  }

  function send() {
    const v = text.value.trim();
    if (!v || !mqttClient || !mqttClient.connected) return;
    sendObj({type:"chat", text:v});
    addMsg("kio", v, new Date().toISOString());
    text.value = ""; text.style.height = "auto"; sendBtn.disabled = true;
  }
  sendBtn.onclick = send;
  text.addEventListener("input", () => {
    text.style.height = "auto"; text.style.height = Math.min(text.scrollHeight, 110) + "px";
    sendBtn.disabled = !text.value.trim();
  });
  text.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });

  setInterval(() => {
    if (document.visibilityState === "visible") sendObj({type:"ping"});
  }, 60000);

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible" || !KEY) return;
    if (!mqttClient || !mqttClient.connected) {
      dlog("VISIBLE, force reconnect");
      connect();
    }
  });

  if (KEY) boot();
  (function(){ const w=document.getElementById("wipe");
    w.onclick=()=>{ try{localStorage.clear();}catch(e){} 
      if("serviceWorker" in navigator){ navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())); }
      if(window.caches){ caches.keys().then(ks=>ks.forEach(k=>caches.delete(k))); }
      setTimeout(()=>location.href=location.pathname+"?t="+Date.now(), 800); };
  })();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js?v=8").catch(()=>{});
  }
})();
</script>
</body>
</html>
